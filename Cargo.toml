[package]
name = "rust-auto-shutdown"
version = "0.2.1"
edition = "2024"
rust-version = "1.88"
description = "A small Windows shutdown timer with a Traditional Chinese desktop UI"
repository = "https://github.com/ntustRay/rust-auto-shutdown"
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
eframe = { version = "=0.33.3", default-features = false, features = ["accesskit", "default_fonts", "glow", "x11", "wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_Foundation"] }

[profile.release]
strip = true
lto = "thin"

