[package]
name = "r-auto-shutdown"
version = "0.3.2"
edition = "2024"
rust-version = "1.88"
description = "A cross-platform desktop shutdown timer with a Traditional Chinese UI"
repository = "https://github.com/ntustRay/rust-auto-shutdown"
publish = false

[lib]
name = "rust_auto_shutdown"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock"] }
eframe = { version = "=0.33.3", default-features = false, features = ["accesskit", "default_fonts", "glow", "x11", "wayland"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(windows)'.dependencies]
raw-window-handle = "0.6"
windows-sys = { version = "0.61", features = ["Win32_System_Console", "Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[profile.release]
strip = true
lto = "thin"

